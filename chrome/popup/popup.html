<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coffer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-head">
        <img src="../icons/coffer-favicon-32.png" width="32" height="32" alt="">
        <div class="brand-copy">
          <strong>Coffer</strong>
          <span>Codes</span>
        </div>
        <div class="header-actions">
          <button type="button" class="header-button privacy-button" id="toggle-privacy" aria-label="Mask usernames" aria-pressed="true" aria-controls="page-codes-list codes-list" title="Show usernames" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
              <path class="privacy-slash" d="M4 4l16 16"></path>
            </svg>
          </button>
          <button type="button" class="header-button lock-button" id="lock-coffer" aria-label="Lock Coffer" title="Lock Coffer" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="4" y="11" width="16" height="9" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="connection-card" id="connection-card" aria-label="Coffer URL">
        <form id="connection-form" class="connection-form">
          <label class="url-field">
            <span>Coffer URL</span>
            <span class="url-control">
              <input id="coffer-origin" name="cofferOrigin" inputmode="url" autocomplete="url" placeholder="https://coffer.yourhost.com">
              <button type="button" class="icon-button" id="open-coffer" aria-label="Open Coffer">
                <span aria-hidden="true"></span>
              </button>
            </span>
          </label>

          <div class="auth-fields" id="auth-card" hidden>
            <label>
              <span>Email</span>
              <input id="coffer-email" name="identifier" type="email" autocomplete="username" placeholder="you@example.com">
            </label>
            <label>
              <span>Password</span>
              <input id="coffer-password" name="password" type="password" autocomplete="current-password">
            </label>
            <label class="remember-row">
              <input id="coffer-remember" name="rememberLogin" type="checkbox">
              <span>Keep unlocked for up to 12 hours</span>
            </label>
            <button type="submit" class="unlock-button">Unlock</button>
          </div>
        </form>
      </section>

      <section class="status-card" id="status" role="status" aria-live="polite" hidden>
      </section>
      <p class="visually-hidden" id="copy-status" role="status" aria-live="polite"></p>

      <section class="vault-tools" id="vault-tools" hidden>
        <input id="code-search" type="search" placeholder="Search codes" autocomplete="off">
      </section>

      <section class="codes page-codes" id="page-codes" aria-labelledby="page-codes-title" hidden>
        <h2 id="page-codes-title">This Page</h2>
        <div id="page-codes-list" class="codes-list"></div>
      </section>

      <section class="codes" id="all-codes" aria-label="All codes" hidden>
        <div id="codes-list" class="codes-list"></div>
      </section>
    </main>
    <script src="../browser-compat.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
