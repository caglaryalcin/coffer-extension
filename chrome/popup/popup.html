<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coffer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-head">
        <img src="../icons/coffer-favicon-32.png" width="32" height="32" alt="">
        <div class="brand-copy">
          <strong>Coffer</strong>
          <span>Codes</span>
        </div>
        <div class="header-actions">
          <button type="button" class="header-button" id="toggle-settings" aria-label="Open settings" aria-expanded="false" aria-controls="popup-settings" title="Settings" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
            </svg>
          </button>
          <button type="button" class="header-button" id="refresh-vault" aria-label="Refresh vault" title="Refresh vault" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 7v5h-5M4 17v-5h5"></path>
              <path d="M6 7a7 7 0 0 1 11-1l3 6M4 12l3 6a7 7 0 0 0 11-1"></path>
            </svg>
          </button>
          <button type="button" class="header-button privacy-button" id="toggle-privacy" aria-label="Mask usernames" aria-pressed="false" aria-controls="page-codes-list codes-list" title="Hide usernames" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
              <path class="privacy-slash" d="M4 4l16 16"></path>
            </svg>
          </button>
          <button type="button" class="header-button lock-button" id="lock-coffer" aria-label="Lock Coffer" title="Lock Coffer" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="4" y="11" width="16" height="9" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="connection-card" id="connection-card" aria-label="Coffer URL">
        <form id="connection-form" class="connection-form" autocomplete="on">
          <label class="url-field">
            <span>Coffer URL</span>
            <span class="url-control">
              <input id="coffer-origin" name="cofferOrigin" inputmode="url" autocomplete="url" placeholder="https://coffer.yourhost.com">
              <button type="button" class="icon-button" id="open-coffer" aria-label="Open Coffer">
                <span aria-hidden="true"></span>
              </button>
            </span>
          </label>

          <div class="auth-fields" id="auth-card" hidden>
            <label>
              <span>Email</span>
              <input id="coffer-email" name="identifier" type="email" autocomplete="username" placeholder="you@example.com">
            </label>
            <label>
              <span>Password</span>
              <input id="coffer-password" name="password" type="password" autocomplete="current-password">
            </label>
            <fieldset class="saved-login-options">
              <legend>Saved sign-in</legend>
              <label class="remember-row">
                <input id="coffer-remember-email" name="rememberEmail" type="checkbox">
                <span>Remember email</span>
              </label>
              <label class="remember-row">
                <input id="coffer-remember-password" name="rememberPassword" type="checkbox">
                <span>Remember password on this device</span>
              </label>
            </fieldset>
            <label class="remember-row remember-session-row">
              <input id="coffer-remember" name="rememberLogin" type="checkbox">
              <span class="remember-session-copy">
                <span>Keep unlocked for</span>
                <select id="coffer-remember-duration" name="rememberDuration" aria-label="Keep unlocked duration">
                  <option value="43200000">12h</option>
                  <option value="86400000">24h</option>
                  <option value="259200000">3d</option>
                  <option value="432000000">5d</option>
                  <option value="604800000">1w</option>
                </select>
                <span>including browser restarts</span>
              </span>
            </label>
            <button type="submit" class="unlock-button">Unlock</button>
          </div>
        </form>
      </section>

      <section class="status-card" id="status" role="status" aria-live="polite" hidden>
      </section>
      <p class="visually-hidden" id="copy-status" role="status" aria-live="polite"></p>

      <section class="settings-card" id="popup-settings" aria-labelledby="settings-title" hidden>
        <div class="settings-head">
          <div>
            <h2 id="settings-title">Settings</h2>
            <p>Choose which groups appear in the extension.</p>
          </div>
          <button type="button" class="settings-close" id="close-settings" aria-label="Close settings">Done</button>
        </div>
        <fieldset class="group-visibility-settings">
          <legend>Visible groups</legend>
          <div id="group-visibility-list" class="group-visibility-list"></div>
        </fieldset>
      </section>

      <section class="vault-tools" id="vault-tools" hidden>
        <input id="code-search" type="search" placeholder="Search codes" autocomplete="off">
      </section>

      <section class="codes page-codes" id="page-codes" aria-labelledby="page-codes-title" hidden>
        <h2 id="page-codes-title">This Page</h2>
        <div id="page-codes-list" class="codes-list"></div>
      </section>

      <section class="codes" id="all-codes" aria-label="All codes" hidden>
        <div id="codes-list" class="codes-list"></div>
      </section>
    </main>
    <script src="../browser-compat.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
