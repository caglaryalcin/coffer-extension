<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coffer Autofill Test</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #181a1b;
        --surface: #202326;
        --surface-2: #25292d;
        --line: #413f3f;
        --accent: #ca7373;
        --accent-soft: rgba(202, 115, 115, .15);
        --text: #d8d3d0;
        --muted: #98938f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      header {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 14px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      label {
        display: grid;
        gap: 6px;
      }

      label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: var(--paper);
        color: var(--text);
        font: inherit;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .otp-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 128px;
        gap: 10px;
        align-items: end;
      }

      code {
        display: grid;
        min-height: 48px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 780;
        letter-spacing: .08em;
      }

      button {
        min-height: 44px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #181a1b;
        font: inherit;
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Coffer Autofill Test</h1>
        <p>Use this page as a neutral target for login and one-time-code field testing.</p>
      </header>

      <form>
        <label>
          <span>Email</span>
          <input name="email" type="email" autocomplete="username" placeholder="you@example.com">
        </label>

        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password">
        </label>

        <div class="otp-row">
          <label>
            <span>One-time code</span>
            <input name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
          </label>
          <code>123456</code>
        </div>

        <button type="submit">Submit Test</button>
      </form>
    </main>
  </body>
</html>
